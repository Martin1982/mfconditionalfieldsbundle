name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable

      - name: Check the coding standard
        run: composer cs

      - name: Run static analysis
        run: composer phpstan

  tests:
    name: "PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} (${{ matrix.dependencies }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['7.*', '8.*']
        dependencies: ['highest']
        exclude:
          # Symfony 8 requires PHP 8.4 or higher.
          - php: '8.2'
            symfony: '8.*'
          - php: '8.3'
            symfony: '8.*'
        include:
          - php: '8.2'
            symfony: '7.*'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2, flex

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}

      - name: Run the test suite
        run: vendor/bin/phpunit
